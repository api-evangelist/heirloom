aid: heirloom
name: Heirloom
description: >-
  Heirloom Carbon Technologies, Inc. is a San Francisco Bay Area direct air capture (DAC)
  company that removes carbon dioxide from the atmosphere by accelerating the natural
  mineralization of limestone. Heirloom spreads calcium oxide on vertical trays where it
  re-absorbs atmospheric CO2 in days rather than years, then uses electric kilns to release
  the captured CO2 for permanent geologic or in-concrete storage. The company opened the
  first commercial DAC facility in the United States, sells permanent carbon removal credits
  to individuals, businesses and enterprises, and has signed offtake agreements with
  Microsoft, Frontier, United's Sustainable Flight Fund and CarbonCure. It is an industrial
  climate-technology company; it does not operate a public developer program or API.
